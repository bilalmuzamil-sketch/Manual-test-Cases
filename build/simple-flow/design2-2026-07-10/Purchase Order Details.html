<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Order Details — Receive</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="po-details.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="po-data.jsx"></script>
  <script type="text/babel" src="PODetails.jsx"></script>
  <script type="text/babel">
    const { createRoot } = ReactDOM;
    const { Icon, PODetails } = window;

    function Page() {
      return (
        <div>
          <header className="app-header">
            <div className="logo">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            </div>
            <nav className="nav">
              <a href="#" className="nav-link">Work Orders</a>
              <a href="#" className="nav-link">Schedule</a>
              <a href="#" className="nav-link">Customers</a>
              <a href="#" className="nav-link active">Parts</a>
              <a href="#" className="nav-link">Reports</a>
            </nav>
            <div className="search-bar">
              <Icon name="search" size={18} style={{ color: 'var(--sv-fg-tertiary)' }} />
              <input type="text" placeholder="Search" />
              <span className="kbd">⌘K</span>
            </div>
            <div className="header-right">
              <div className="clock-in"><Icon name="clock" size={20} style={{ color: 'var(--sv-grey-600)' }} /> Clock In</div>
              <Icon name="bell" size={22} style={{ color: 'var(--sv-grey-600)' }} />
              <div className="user-chip">Staging Heavy Duty - 9919<span className="avatar">AS</span></div>
            </div>
          </header>

          <div style={{ maxWidth: 1320, margin: '0 auto', padding: '24px 32px 0' }}>
            <a href="Purchase Orders List.html" className="back-link">
              <Icon name="chevron-right" size={16} style={{ transform: 'rotate(180deg)' }} /> Back to Purchase Orders
            </a>
          </div>

          <PODetails data={window.PO_SCENARIOS.multi} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<Page />);
  </script>
</body>
</html>
