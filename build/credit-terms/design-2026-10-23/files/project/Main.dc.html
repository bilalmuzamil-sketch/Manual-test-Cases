  <figcaption style="font-size: 13px; line-height: 19px; color: var(--sv-text-secondary);"><ul style="margin: 0; padding-left: 18px;"><li style="margin: 0 0 6px;">No before: Credit Terms is a new Settings page, so production has nothing to compare. Matches the current build (Active tab).</li><li style="margin: 0 0 6px;">One table per tab, no sections. Columns: Name, Due, Customers, Vendors, ⋯.</li><li style="margin: 0 0 6px;">Order: COD, Due on Receipt, Net terms by days (the shop's own Net 10 sits between Net 7 and Net 15), "of the following month" terms by day, any other terms of the shop's own A to Z, Credit Hold last. Terms with the same days sort A to Z.</li><li style="margin: 0 0 6px;">Due wording: COD "Paid when the invoice is created"; Due on Receipt "Due on the invoice date"; Net X "X days after the invoice date"; day of month "10th of the following month"; Credit Hold "Invoicing is blocked".</li><li style="margin: 0 0 6px;">COD, Due on Receipt and Credit Hold are followed by the DS info icon (next two boards) and the lock icon; Net and day-of-month terms have neither, the Due column explains them. Lock hover: "Always available. COD, Due on Receipt and Credit Hold can't be deactivated." (open on COD).</li><li style="margin: 0 0 6px;">The Customers and Vendors columns show how many customers and vendors are on each term (0 shown as 0). The Customers count never includes the Counter Sale customer.</li><li style="margin: 0 0 6px;">The default row carries a "Default" badge. New Credit Term is the one primary button, top right; the page ⋯ menu (Audit Log) sits beside it.</li><li style="margin: 0 0 6px;">Permissions: the page, the terms and the default need Settings → Finance.</li><li style="margin: 0 0 6px;">Source: Payment Methods uses native tabs on its Settings page (Customer Payments / Vendor Payments, PaymentMethodsTabs.vue), and the Inventory list splits Active and Inactive into tabs (Parts Lifecycle Update PRD 829227015). Tab look matches the Inspection Templates tabs in production: label, then a rounded count pill (selected: blue text, blue underline, light blue pill; unselected: grey text, light grey pill), drawn with DS tokens and the DS Badge.</li><li style="margin: 0 0 6px;">Source: Payment Methods puts its one add button, "New payment method", at the top right. DS rule: one primary button per view.</li><li style="margin: 0 0 6px;">Source: DS Badge, info tone, for the "Default" tag. DS lock icon for the three always-available terms.</li><li style="margin: 0 0 6px;">Names and counts are demo data and differ from the build screenshots; layout, wording and states match the build (canvas-check sheets in local-check).</li></ul></figcaption>
</figure>
