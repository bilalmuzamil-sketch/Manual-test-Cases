      <img src="/_blob/215b27cfb7f082f59c1b41502dce057e" alt="Production A/R Aging Detail with links on invoices from another location" style="width: 960px; height: 600px; display: block; border: 1px solid var(--sv-border-default); border-radius: 8px;">

    <figure style="margin: 0; width: 960px; display: flex; flex-direction: column; gap: 12px;">
