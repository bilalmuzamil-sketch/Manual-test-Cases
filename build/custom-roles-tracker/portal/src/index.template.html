<style>
/* Layout: a release ledger — a version strip across the top (one stop per snapshot, oldest left),
   the selected version's record below, and tool views (matrix, comparison, Track Changes) beside. */
:root {
  --bg: #f3f6f6; --surface: #ffffff; --surface-2: #eaf0f0; --ink: #11221f; --muted: #556866; --line: #d3dedd;
  --accent: #0a6b67; --accent-ink: #ffffff; --accent-soft: #dcefed;
  --good: #276a2c; --good-soft: #e1f1df; --warn: #8a5a00; --warn-soft: #fbefd6; --bad: #a8261d; --bad-soft: #fbe3e0;
  --info: #24539c; --info-soft: #e1eaf8; --plum: #6b3a8a; --plum-soft: #efe5f5;
  --quote: #f6f3e8; --quote-line: #c9b98a;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1716; --surface: #13201f; --surface-2: #1a2a29; --ink: #dfeae8; --muted: #93a8a5; --line: #26393a;
  --accent: #4cb6ae; --accent-ink: #062320; --accent-soft: #143a37;
  --good: #7cc683; --good-soft: #17301a; --warn: #e2b25a; --warn-soft: #33270d; --bad: #f0857b; --bad-soft: #3a1714;
  --info: #8ab4f2; --info-soft: #172840; --plum: #c8a0e2; --plum-soft: #2c1d38;
  --quote: #1d2a22; --quote-line: #6e6a46; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1716; --surface: #13201f; --surface-2: #1a2a29; --ink: #dfeae8; --muted: #93a8a5; --line: #26393a;
  --accent: #4cb6ae; --accent-ink: #062320; --accent-soft: #143a37;
  --good: #7cc683; --good-soft: #17301a; --warn: #e2b25a; --warn-soft: #33270d; --bad: #f0857b; --bad-soft: #3a1714;
  --info: #8ab4f2; --info-soft: #172840; --plum: #c8a0e2; --plum-soft: #2c1d38;
  --quote: #1d2a22; --quote-line: #6e6a46; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: .005em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.08rem; font-weight: 600; }
h4 { font-size: .95rem; font-weight: 600; }
p { margin: 0; max-width: 72ch; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: .86em; }
.muted { color: var(--muted); }
.eyebrow { font: 600 .72rem/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand small { color: var(--muted); font-size: .8rem; }
.prod { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.prod b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }

/* version strip */
.strip { overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--surface); }
.strip ol { list-style: none; margin: 0; display: flex; gap: 0; padding-block: 0; min-width: max-content; }
.stop { position: relative; }
.stop a { display: flex; flex-direction: column; gap: 2px; padding: 10px 18px 11px; text-decoration: none; color: var(--ink); border-bottom: 3px solid transparent; }
.stop a:hover { background: var(--surface-2); }
.stop a[aria-current="page"] { border-bottom-color: var(--accent); }
.stop .k { font: 600 .68rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stop .n { font-family: var(--font-display); font-weight: 600; font-size: .98rem; white-space: nowrap; }
.stop + .stop::before { content: "→"; position: absolute; left: -5px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .8rem; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px; }
.tools a { text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); font-size: .88rem; background: var(--surface); }
.tools a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tools a.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tools a.primary[aria-current="page"] { color: var(--accent-ink); }

main.wrap { padding-block: 22px 60px; display: flex; flex-direction: column; gap: 22px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-end; justify-content: space-between; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 22px; }
.fact { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fact span:last-child { overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.c-added_permission, .c-good { background: var(--good-soft); color: var(--good); }
.c-removed_permission, .c-bad { background: var(--bad-soft); color: var(--bad); }
.c-modified_permission, .c-warn { background: var(--warn-soft); color: var(--warn); }
.c-default_changed, .c-info { background: var(--info-soft); color: var(--info); }
.c-dependency_changed { background: var(--plum-soft); color: var(--plum); }
.c-backend_enforcement_changed { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.c-frontend_behavior_changed { background: var(--accent-soft); color: var(--accent); }
.c-role_assignment_changed { background: var(--warn-soft); color: var(--warn); }
.c-neutral { background: var(--surface-2); color: var(--muted); }
.risk-High { background: var(--bad); color: #fff; }
.risk-Medium { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.risk-Low { background: var(--surface-2); color: var(--muted); }
.st-Matches { background: var(--good-soft); color: var(--good); }
.st-Different { background: var(--info-soft); color: var(--info); }
.st-Approved { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.st-Possible { background: var(--warn-soft); color: var(--warn); }
.st-Needs { background: var(--plum-soft); color: var(--plum); }
.evidence-level { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); padding: 4px 10px; }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; position: sticky; top: 0; z-index: 1; }
tbody tr:last-child td { border-bottom: 0; }
tr.group td { background: var(--surface-2); font-family: var(--font-display); font-weight: 600; font-size: .86rem; letter-spacing: .02em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* matrix */
.matrix th.role { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 8px 4px; font-size: .78rem; text-align: left; height: 150px; vertical-align: bottom; }
.matrix td.cell { text-align: center; padding: 4px; min-width: 36px; font-variant-numeric: tabular-nums; }
.matrix td.cell span { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 4px; font-size: .78rem; font-weight: 600; }
.on { background: var(--accent); color: var(--accent-ink); }
.off { background: transparent; color: var(--line); border: 1px solid var(--line); }
.unstated { color: var(--muted); }
.chg-on { background: var(--good); color: #fff; }
.chg-off { background: var(--bad); color: #fff; }
.matrix tr.sel td { background: var(--accent-soft); }
.matrix td.pname { min-width: 220px; cursor: pointer; }
.matrix td.pname:hover { text-decoration: underline; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); align-items: center; }
.legend span.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }

/* quotes */
blockquote.q { margin: 0; overflow-wrap: anywhere; padding: 8px 12px; background: var(--quote); border-left: 3px solid var(--quote-line); font-size: .9rem; max-width: 80ch; }
blockquote.q cite { display: block; font-style: normal; font-size: .76rem; color: var(--muted); margin-top: 4px; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); min-width: 0; }
.ctl select, .ctl input[type="search"], .ctl input[type="text"], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 6px 8px; color: var(--ink); font-size: .9rem; max-width: 100%; }
.ctl input[type="search"] { width: 240px; }
label.check { display: inline-flex; gap: 6px; align-items: center; font-size: .86rem; color: var(--ink); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 7px 14px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* change cards */
.changes { display: flex; flex-direction: column; gap: 10px; }
details.change { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.change > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
details.change > summary::-webkit-details-marker { display: none; }
details.change[open] > summary { border-bottom: 1px solid var(--line); }
.ba { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; font-size: .86rem; }
.ba > div { background: var(--surface-2); border-radius: 5px; padding: 6px 8px; min-width: 0; overflow-wrap: anywhere; }
.change .body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.change ul { margin: 0; padding-left: 18px; }
.change li + li { margin-top: 3px; }
.verify { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .85rem; border-top: 1px dashed var(--line); padding-top: 10px; }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 var(--radius) var(--radius) 0; font-size: .9rem; }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }
.notice.bad { border-color: var(--bad); background: var(--bad-soft); }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.steps > li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: .85rem; }
pre.cmd { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; font: .82rem/1.5 var(--font-mono); overflow-x: auto; white-space: pre; }
.atoms { display: flex; flex-wrap: wrap; gap: 4px; }
.atoms code { background: var(--surface-2); border-radius: 3px; padding: 1px 5px; font-size: .76rem; }
@media (max-width: 640px) {
  .ba { grid-template-columns: 1fr; } .ba .arrow { display: none; }
  details.change > summary { grid-template-columns: 1fr; }
  .ctl input[type="search"] { width: 100%; }
  .prod { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; }
.tally { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.tally button { all: unset; cursor: pointer; display: contents; }
.tally .big { font-size: 1.4rem; text-align: right; }
.tally button:hover span:last-child, .tally button:focus-visible span:last-child { text-decoration: underline; }
.lead { font-size: 1.02rem; max-width: 70ch; }
.todo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.todo a { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); height: 100%; box-sizing: border-box; }
.todo a:hover { border-color: var(--accent); }
.todo b { color: var(--accent); }
dl.glossary { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 8px 18px; margin: 0; }
dl.glossary dt { font-weight: 600; }
dl.glossary dd { margin: 0; max-width: 70ch; }
details.tech { border: 1px dashed var(--line); border-radius: var(--radius); padding: 6px 10px; font-size: .84rem; }
details.tech > summary { cursor: pointer; color: var(--muted); }
details.tech[open] > summary { margin-bottom: 8px; }
details.tech .inner { display: flex; flex-direction: column; gap: 8px; }
details.group-behind { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
details.group-behind > summary { cursor: pointer; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
details.group-behind > .inner { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.group-title { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
ol.check { margin: 0; padding-left: 20px; }
ol.check li + li { margin-top: 4px; }
.pr-High { background: var(--bad); color: #fff; }
.pr-Medium { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.pr-Low { background: var(--surface-2); color: var(--muted); }
</style>

<script>
(function () {
'use strict';
const E = window.CRPEngine;
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qt = (x) => '“' + x + '”';
const andList = (xs) => (xs.length <= 1 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]);
// plain names for the kinds of change and for the comparison verdicts
const KIND = { added_permission: 'New permission', removed_permission: 'Permission removed', modified_permission: 'Permission renamed',
  default_changed: 'Who has it changed', dependency_changed: 'Linked permissions changed', backend_enforcement_changed: 'Behind-the-scenes check',
  frontend_behavior_changed: 'Screens changed', role_assignment_changed: 'Role changed' };
const GROUPS = { access: 'Changes to who can do what', screens: 'Changes to what people see on screen', behind: 'Behind-the-scenes checks' };
const VERDICT = { 'Matches original PRD': ['Matches the plan', 'st-Matches', 'The app does what the original plan says.'],
  'Different from original PRD': ['Changed since the plan', 'st-Different', 'Different from the original plan, but a later version of the plan describes it.'],
  'Approved post-PRD change': ['Changed, with approval', 'st-Approved', 'Different from the original plan, and an approval is recorded.'],
  'Possible undocumented behavior': ['Not in the plan', 'st-Possible', 'The app does something no version of the plan describes.'],
  'Needs clarification': ['Question for the product owner', 'st-Needs', 'The documents disagree or are silent, so someone has to decide.'] };
const STATUSES = ['Not Tested', 'Passed', 'Failed', 'Blocked', 'Needs Clarification'];
const ST_CLS = { Passed: 'c-good', Failed: 'c-bad', Blocked: 'c-warn', 'Needs Clarification': 'c-warn' };
const EDITOR = 'Administration › Roles and Permissions';
let D = null;
const S = {};
let db = null, user = null, me = null, canWriteDb = false, canApprove = false;
const verif = {}, approvals = {}, requests = [];
const names = {};

function hid(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function itemKey(scope, c) { return scope + ':' + hid([c.category, c.permission || '', c.endpoint || '', c.role || '', c.title].join('|')); }

function reg() { return D.registry.snapshots; }
function implEntries() { return reg().filter((s) => s.kind === 'implementation'); }
function latestImpl() { const xs = implEntries(); return xs[xs.length - 1]; }
function entry(id) { return reg().find((s) => s.id === id); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(String(iso).length === 10 ? iso + 'T12:00:00Z' : iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function release(marker) { return String(marker || '').replace(/-[0-9a-f]{6,}$/, ''); }
function chip(cls, text) { return `<span class="chip ${cls}">${esc(text)}</span>`; }
function plainLabel(l) { return String(l || '').replace(/\s*\(derived[^)]*\)/, ''); }
function roleNameIn(snap, key) { const r = (snap.roles || []).find((x) => x.key === key || x.impl_role === key); return r ? r.name : key; }
function permLabelIn(snap, key) { const p = (snap.permissions || []).find((x) => x.key === key); return plainLabel(p ? p.label : key); }
/** The name people see for a saved version. */
function nice(e) {
  if (!e) return '—';
  if (e.kind === 'prd') return e.id === 'prd-v7' ? 'Original plan (version 7, June 2026)' : `Newer plan (version ${(e.source || {}).version}, July 2026)`;
  const tag = (e.release.tags || [])[0] || e.release.commit.slice(0, 7);
  return `The app, release ${tag}`;
}
function tech(summary, inner) { return `<details class="tech"><summary>${esc(summary)}</summary><div class="inner">${inner}</div></details>`; }
function testChip(v) { return chip(v ? (ST_CLS[v.status] || 'c-neutral') : 'c-neutral', 'Test result: ' + (v ? v.status : 'Not Tested')); }

// ── routing ──────────────────────────────────────────────────────────────────────────────────
function route() { return (location.hash || '').replace(/^#/, '') || 'home'; }
function render() {
  const r = route();
  document.querySelectorAll('#strip a, #tools a').forEach((a) => {
    if (a.getAttribute('href') === '#' + r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const main = $('#main');
  try {
    if (r.startsWith('snap-')) main.innerHTML = viewSnapshot(r.slice(5));
    else if (r === 'matrix') main.innerHTML = viewMatrix();
    else if (r === 'prd-vs-impl') main.innerHTML = viewPrdVsImpl();
    else if (r === 'compare') main.innerHTML = viewCompare();
    else if (r === 'history') main.innerHTML = viewHistory();
    else if (r === 'track') main.innerHTML = viewTrack();
    else main.innerHTML = viewHome();
  } catch (e) {
    main.innerHTML = `<section class="panel"><div class="notice bad">Sorry, this page could not be shown. Please reload. (${esc(e.message)})</div></section>`;
    console.error(e);
  }
  wire(r);
}

function viewSnapshot(id) {

function viewPrd(s, e) {

  </section>`;
  const roles = `<section class="panel"><h3>Roles in the plan</h3><div class="tbl"><table><thead><tr><th>Role</th><th>What the plan says about it</th><th>Can a shop change it?</th></tr></thead><tbody>
    ${s.roles.map((r) => `<tr><td>${esc(r.name)}${r.impl_role ? '' : '<br><span class="muted">Not a separate role in the app</span>'}</td><td>${esc(r.description_verbatim)}</td>
      <td>${r.editable_when_system === undefined ? '<span class="muted">The plan does not say</span>' : r.editable_when_system ? 'Yes' : 'No'}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  const bySec = {};
  s.permissions.forEach((p) => { (bySec[p.prd_section] = bySec[p.prd_section] || []).push(p); });
  const deps = (k) => s.dependencies.filter((d) => d.child === k);
  const perms = `<section class="panel"><h3>Every permission in the plan</h3>
    <p class="muted">The middle column is the plan’s own words.</p>
    <div class="tbl"><table><thead><tr><th>Permission</th><th>What it controls</th><th>Switched on for</th></tr></thead><tbody>
    ${Object.entries(bySec).map(([sec, ps]) => `<tr class="group"><td colspan="3">${esc(sec)}</td></tr>` + ps.map((p) => {
      const holders = Object.entries(s.role_defaults).filter(([, ks]) => ks.includes(p.key)).map(([r]) => roleNameIn(s, r));
      const covered = (s.matrix_coverage || {})[p.key];
      return `<tr><td>${esc(plainLabel(p.label))}</td>
        <td><blockquote class="q">${esc(p.controls_verbatim)}</blockquote>
          ${deps(p.key).map((d) => `<div class="muted" style="font-size:.84rem;margin-top:4px">${d.kind === 'implies' ? 'Turning this on also turns on' : 'Needs this to be on first:'} ${esc(qt(permLabelIn(s, d.parent)))}</div>`).join('')}</td>

    </tbody></table></div></section>`;
  const rules = `<section class="panel"><h3>Rules the plan sets about roles</h3>${(s.rules || []).map((r) => `<blockquote class="q">${esc(r.verbatim)}</blockquote>`).join('')}

  const log = (s.change_log || []).length ? `<section class="panel"><h3>The plan’s own list of changes</h3>

// ── a list of changes, in plain words ────────────────────────────────────────────────────────
function plainOf(c) {
  return c.plain || { headline: c.title, what: '', why: c.risk_reason, check: c.qa_scenarios || [], group: c.category === 'backend_enforcement_changed' ? 'behind' : 'access',
    priority: c.risk + ' priority', roles: [] };
}
function groupCounts(changes) {
  const n = { access: 0, screens: 0, behind: 0 };
  changes.forEach((c) => { n[plainOf(c).group] = (n[plainOf(c).group] || 0) + 1; });
  return n;
}
function countLine(changes) {
  const n = groupCounts(changes);
  return [n.access && `${n.access} to who can do what`, n.screens && `${n.screens} to screens`, n.behind && `${n.behind} behind the scenes`].filter(Boolean).join(' · ');
}
function changeCard(c, scope) {
  const p = plainOf(c);
  const key = itemKey(scope, c);
  const v = verif[key], ap = approvals[key];
  return `<details class="change"><summary>${chip('pr-' + c.risk, p.priority)}<div><div><b>${esc(p.headline)}</b></div>
      <div class="muted" style="font-size:.84rem;margin-top:2px">${esc([KIND[c.category], p.area, (p.roles || []).length ? 'Roles: ' + p.roles.join(', ') : ''].filter(Boolean).join(' · '))}</div></div>
      ${testChip(v)}</summary>
    <div class="body">
      ${p.what ? `<div><h4>What changed</h4><p>${esc(p.what)}</p></div>` : ''}
      ${p.before || p.after ? `<div class="ba"><div><div class="eyebrow">Before</div>${esc(p.before || '—')}</div><div class="arrow muted">→</div><div><div class="eyebrow">Now</div>${esc(p.after || '—')}</div></div>` : ''}
      <div><h4>Why it matters</h4><p>${esc(p.why)}</p></div>
      ${(p.permissions || []).length > 3 ? `<div><h4>Permissions that allow it</h4><p>${esc(p.permissions.join(' · '))}</p></div>` : ''}
      <div><h4>How to check it</h4><ol class="check">${p.check.map((x) => '<li>' + esc(x) + '</li>').join('')}</ol>
        <p class="muted" style="font-size:.82rem;margin-top:4px">These are suggestions to help you plan. A change counts as confirmed only when a tester marks it Passed.</p></div>
      <div class="verify">
        <label class="ctl">Test result<select data-verify="${esc(key)}" ${canWriteDb ? '' : 'disabled'}>${STATUSES.map((st) => `<option ${((v && v.status) || 'Not Tested') === st ? 'selected' : ''}>${st}</option>`).join('')}</select></label>
        ${v ? `<span class="muted">set by ${esc(names[v.by] || 'a teammate')} on ${esc(fmtDate(v.at))}</span>` : ''}
        ${approvalBlock(key, ap)}
      </div>
      ${tech('Technical details (for developers)', `<p><b>${esc(c.title)}</b></p><p>Before: <code>${esc(c.before)}</code><br>Now: <code>${esc(c.after)}</code></p>

        <ul>${(c.qa_scenarios || []).map((x) => '<li>' + esc(x) + '</li>').join('')}</ul>
        <pre class="cmd">${esc(JSON.stringify(c.evidence, null, 1))}</pre>`)}
    </div></details>`;
}
function changeList(changes, scope) {
  const by = { access: [], screens: [], behind: [] };
  changes.forEach((c) => { (by[plainOf(c).group] = by[plainOf(c).group] || []).push(c); });
  const block = (g, xs) => `<div class="changes"><div class="group-title"><h4>${esc(GROUPS[g])}</h4><span class="muted">${xs.length}</span></div>${xs.map((c) => changeCard(c, scope)).join('')}</div>`;
  return `<div class="changes">
    ${by.access.length ? block('access', by.access) : ''}
    ${by.screens.length ? block('screens', by.screens) : ''}
    ${by.behind.length ? `<details class="group-behind"><summary><h4>${esc(GROUPS.behind)}</h4><span class="muted">${by.behind.length} · click to open</span>
        <span class="muted" style="flex-basis:100%;font-size:.86rem">Protections inside the app that people don’t see directly. Each one is tested by trying the action as someone with the permission and as someone without it.</span></summary>
      <div class="inner">${by.behind.map((c) => changeCard(c, scope)).join('')}</div></details>` : ''}
  </div>`;
}

function approvalBlock(key, ap) {

    <dt>Asked for by</dt><dd>${f(ap && ap.requested_by)}</dd><dt>Approved by</dt><dd>${f(ap && ap.approved_by)}</dd><dt>Date approved</dt><dd>${f(ap && ap.approval_date)}</dd>

// ── who can do what ──────────────────────────────────────────────────────────────────────────
const M = { a: null, b: '', q: '', role: '', changedOnly: false, sel: null };
function viewMatrix() {
  if (!M.a) M.a = latestImpl().id;
  const opts = (sel, withNone) => (withNone ? '<option value="">Nothing — just show one version</option>' : '') + reg().map((s) => `<option value="${esc(s.id)}" ${sel === s.id ? 'selected' : ''}>${esc(nice(s))}</option>`).join('');
  const A = E.normalise(S[M.a]), B = M.b ? E.normalise(S[M.b]) : null;
  const roles = Object.keys(A.roles).concat(B ? Object.keys(B.roles).filter((r) => !A.roles[r]) : []);
  const rolesShown = M.role ? roles.filter((r) => r === M.role) : roles;
  const keys = Array.from(new Set(Object.keys(A.perms).concat(B ? Object.keys(B.perms) : [])));
  const lab = (k) => plainLabel(((B && B.perms[k]) || A.perms[k] || {}).label || k);
  const grp = (k) => ((B && B.perms[k]) || A.perms[k] || {}).group || ((A.perms[k] || {}).section) || 'Settings';
  const stated = (Mx, k, r) => !Mx.coverage || (Mx.coverage[k] && Mx.coverage[k].has(r));
  const val = (Mx, k, r) => (!Mx.roles[r] || !Mx.perms[k]) ? null : (!stated(Mx, k, r) ? undefined : !!(Mx.defaults[r] && Mx.defaults[r].has(k)));
  const q = M.q.toLowerCase();
  let rows = keys.filter((k) => !q || String(lab(k)).toLowerCase().includes(q));
  const changed = (k) => B && rolesShown.some((r) => { const a = val(A, k, r), b = val(B, k, r); return a !== b && a !== undefined && b !== undefined; });
  if (M.changedOnly && B) rows = rows.filter(changed);
  const byG = {};
  rows.forEach((k) => { (byG[grp(k)] = byG[grp(k)] || []).push(k); });
  const one = (v) => (v === null ? '<span class="unstated" title="Not in this version">—</span>' : v === undefined ? '<span class="unstated" title="This version does not say">·</span>' : v ? '<span class="on" title="Switched on">✓</span>' : '<span class="off" title="Switched off"></span>');
  const cell = (k, r) => {
    const a = val(A, k, r);
    if (!B) return one(a);
    const b = val(B, k, r);
    if (a === b || a === undefined || b === undefined || a === null || b === null) return one(b === null ? a : b);
    return b ? '<span class="chg-on" title="Was off, now on">+</span>' : '<span class="chg-off" title="Was on, now off">−</span>';
  };
  const detail = M.sel ? matrixDetail(M.sel, A, B) : '<p class="muted">Click a permission name to see what it controls and what it is linked to.</p>';
  return `<section class="panel">
    <div class="head"><div><div class="eyebrow">Who can do what</div><h2>Every role and every permission</h2></div>
      <div class="legend"><span><span class="sw on"></span>switched on</span><span><span class="sw off"></span>switched off</span><span>· this version doesn’t say</span>${B ? '<span><span class="sw chg-on"></span>newly switched on</span><span><span class="sw chg-off"></span>newly switched off</span>' : ''}</div></div>
    <p class="muted">A tick means the role starts with this permission switched on. Shops can change their own roles, so a real shop’s roles may differ.</p>
    <div class="controls">
      <label class="ctl">Show<select id="mA">${opts(M.a)}</select></label>
      <label class="ctl">Compare with<select id="mB">${opts(M.b, true)}</select></label>
      <label class="ctl">Search<input type="search" id="mQ" value="${esc(M.q)}" placeholder="for example: invoice"></label>
      <label class="ctl">Role<select id="mR"><option value="">All roles</option>${roles.map((r) => `<option value="${esc(r)}" ${M.role === r ? 'selected' : ''}>${esc(((B && B.roles[r]) || A.roles[r]).name)}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" id="mC" ${M.changedOnly ? 'checked' : ''} ${B ? '' : 'disabled'}> Only show differences</label>
    </div>
    <div class="grid2" style="grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr)">
      <div class="tbl matrix"><table><thead><tr><th>Permission</th>${rolesShown.map((r) => `<th class="role">${esc(((B && B.roles[r]) || A.roles[r]).name)}</th>`).join('')}</tr></thead><tbody>
      ${Object.entries(byG).map(([g, ks]) => `<tr class="group"><td colspan="${rolesShown.length + 1}">${esc(g)}</td></tr>` + ks.map((k) =>
        `<tr class="${M.sel === k ? 'sel' : ''}"><td class="pname" data-perm="${esc(k)}" tabindex="0">${esc(lab(k))}</td>${rolesShown.map((r) => `<td class="cell">${cell(k, r)}</td>`).join('')}</tr>`).join('')).join('') || `<tr><td colspan="${rolesShown.length + 1}" class="muted">No permission matches.</td></tr>`}
      </tbody></table></div>
      <aside class="panel" style="padding:14px;align-self:start">${detail}</aside>
    </div></section>`;
}
function matrixDetail(k, A, B) {
  const X = B || A, snap = X.meta;
  const p = X.perms[k] || A.perms[k] || {};
  const L = (x) => plainLabel((X.perms[x] || A.perms[x] || {}).label || x);
  const parents = Object.values(X.deps).filter((d) => d.child === k);

  return `<h3>${esc(plainLabel(p.label || k))}</h3>
    ${p.controls ? `<div><h4>What the plan says it controls</h4><blockquote class="q">${esc(p.controls)}</blockquote></div>` : ''}

    <div><h4>Turning this on also turns on</h4>${parents.length ? parents.map((d) => `<div>${esc(L(d.parent))}${d.kind !== 'implies' ? ' <span class="muted">(must be on first)</span>' : ''}</div>`).join('') : '<span class="muted">Nothing</span>'}</div>
    <div><h4>Turned on automatically by</h4>${children.length ? children.map((d) => `<div>${esc(L(d.child))}</div>`).join('') : '<span class="muted">Nothing</span>'}</div>
    ${ip ? `<div><h4>Also checked behind the scenes?</h4><p>${enforcementPlain(ip)}</p></div>
      ${tech('Technical details (for developers)', `<p><code>${esc(k)}</code></p><div class="atoms">${ip.atoms.map((a) => '<code>' + esc(a) + '</code>').join('') || '—'}</div>

}

// ── check a new release ──────────────────────────────────────────────────────────────────────
const T = { pick: null };
function viewTrack() {
  const latest = latestImpl();
  const recordedTags = new Set(implEntries().flatMap((e) => (e.release.tags || []).concat([e.release.commit])));
  const pending = D.pending || [];
  const unscanned = (D.known_releases || []).filter((t) => !recordedTags.has(t.tag) && !pending.some((p) => (p.release.tags || []).includes(t.tag)));
  const prodRecorded = implEntries().find((e) => e.release.commit && D.deployed.commit && e.release.commit.startsWith(D.deployed.commit));
  const options = [
    ...pending.map((p) => ({ v: 'pending:' + p.snapshot_id, l: `${(p.release.tags || [])[0] || p.release.commit.slice(0, 7)} — checked, waiting for your review` })),
    ...unscanned.map((t) => ({ v: 'tag:' + t.tag, l: `${t.tag} — not checked yet (${fmtDate(t.date)})` })),
    ...implEntries().slice().reverse().map((e) => ({ v: 'rec:' + e.id, l: `${(e.release.tags || [])[0] || e.id} — already checked and saved` })),
  ];
  if (!T.pick) T.pick = options.length ? options[0].v : '';
  let body = '';
  if (T.pick.startsWith('rec:')) {
    const e = entry(T.pick.slice(4));
    body = `<div class="notice">This release was checked and saved on ${esc(fmtDate(e.recorded_at))}: <a href="#snap-${esc(e.id)}">${esc(nice(e))}</a>. A release is never saved twice.</div>`;
  } else if (T.pick.startsWith('pending:')) {
    const p = pending.find((x) => 'pending:' + x.snapshot_id === T.pick);
    const rep = E.compare(S[latest.id], p);
    const rv = approvals['review:' + p.snapshot_id];
    body = `<ol class="steps">
      <li><div><h4>The release was checked</h4><p>Release ${esc((p.release.tags || [])[0] || p.release.ref)} was compared with ${esc(nice(latest))}.</p></div></li>
      <li><div><h4>Read what changed</h4>${rep.changes.length ? `<p style="margin:6px 0"><b>${rep.changes.length} changes</b>: ${esc(countLine(rep.changes))}.</p>` + changeList(rep.changes, 'scan-' + p.snapshot_id)
        : '<div class="empty">No Custom Roles &amp; Permissions changes detected in this release.</div>'}</div></li>
      <li><div><h4>${rep.changes.length ? 'Approve it so it is saved' : 'Save it as “no change” (optional)'}</h4>
        ${rv ? `<p>Approved by ${esc(names[rv.by] || 'a teammate')} on ${esc(fmtDate(rv.at))}. It will be saved permanently the next time the check is run, and it will get its own tab.</p>`
          : canApprove ? `<button class="btn" data-review="${esc(p.snapshot_id)}">${rep.changes.length ? 'Approve and save this release' : 'Save as “no change”'}</button>`
          : '<p class="muted">Someone with edit rights on this page approves it. You can still read the changes and set test results.</p>'}
        ${tech('For the person running the check', `<pre class="cmd">python3 tools/track_changes.py confirm ${esc(p.snapshot_id)} --by "&lt;name&gt;"${rep.changes.length ? '' : ' --checkpoint'}</pre>`)}</div></li></ol>`;
  } else if (T.pick.startsWith('tag:')) {
    const tag = T.pick.slice(4);
    const req = requests.find((r) => r.release === tag);
    body = `<ol class="steps">
      <li><div><h4>Ask for a check</h4><p>This page cannot read the app’s code by itself, so Claude or a developer runs the check. Your request is shown here so they know it is waiting.</p>
        ${req ? `<p>${chip('c-good', 'Requested')} by ${esc(names[req.by] || 'a teammate')} on ${esc(fmtDate(req.at))}.</p>` : canWriteDb ? `<p><button class="btn" data-request="${esc(tag)}">Ask for ${esc(tag)} to be checked</button></p>` : ''}
        ${tech('For the person running the check', `<pre class="cmd">python3 tools/track_changes.py scan --ref ${esc(tag)}</pre>`)}</div></li>
      <li><div><h4>Read what changed</h4><p>When the check is done, every change appears on this page in plain words, with how to test it.</p></div></li>
      <li><div><h4>Approve it</h4><p>Someone with edit rights approves it, and the release is saved permanently with its own tab.</p></div></li></ol>`;
  } else {
    body = '<div class="empty">Nothing new to check. Every known release is already saved.</div>';
  }
  return `<section class="panel">
    <div><div class="eyebrow">Check a new release</div><h2>Has a new release changed who can do what?</h2></div>
    <div class="facts">
      <div class="fact"><span class="eyebrow">The live app is on</span><span>Release ${esc(release(D.deployed.build_marker))}, checked ${esc(fmtDate(D.deployed.measured_at))}</span></div>
      <div class="fact"><span class="eyebrow">Last release saved here</span><span><a href="#snap-${esc(latest.id)}">${esc(nice(latest))}</a></span></div>
      <div class="fact"><span class="eyebrow">Is the live app saved here?</span><span>${prodRecorded ? chip('c-good', 'Yes, up to date') : chip('c-warn', 'No, a new release needs checking')}</span></div>
    </div>
    <div class="controls"><label class="ctl">Choose a release<select id="tPick">${options.map((o) => `<option value="${esc(o.v)}" ${T.pick === o.v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select></label>
      ${canWriteDb ? '<button class="btn ghost" data-request="production">Ask for the live app to be checked now</button>' : ''}</div>
    ${body}
    <details class="tech"><summary>How the check works</summary><div class="inner">
      <p>1. The check finds out exactly which release is live, or uses the release you choose.</p>
      <p>2. It reads that release of the app: every role, every permission, which permissions are linked, and every behind-the-scenes check.</p>
      <p>3. It compares that with the last saved release, by meaning. Tidying, re-ordering or comments in the code are ignored.</p>
      <p>4. You read the changes here. Nothing is saved until someone approves it. A release with no changes is saved only as “no change”, and a release already saved is refused.</p>
      <pre class="cmd">python3 tools/track_changes.py scan --production
python3 tools/track_changes.py confirm &lt;id&gt; --by "&lt;name&gt;"</pre></div></details>
  </section>`;
}

// ── interaction wiring ───────────────────────────────────────────────────────────────────────
function wire(r) {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  if (r === 'home') document.querySelectorAll('[data-verdict]').forEach((b) => b.addEventListener('click', () => { P.status = b.dataset.verdict; location.hash = 'prd-vs-impl'; }));
  if (r === 'matrix') {
    on('#mA', 'change', (e) => { M.a = e.target.value; render(); });
    on('#mB', 'change', (e) => { M.b = e.target.value; render(); });
    on('#mR', 'change', (e) => { M.role = e.target.value; render(); });
    on('#mC', 'change', (e) => { M.changedOnly = e.target.checked; render(); });
    on('#mQ', 'input', debounce((e) => { M.q = e.target.value; render(); $('#mQ').focus(); }, 250));
    document.querySelectorAll('td.pname').forEach((td) => {
      const pick = () => { M.sel = td.dataset.perm; render(); };
      td.addEventListener('click', pick);
      td.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
  }
  if (r === 'prd-vs-impl') {
    document.querySelectorAll('[data-pstatus]').forEach((b) => b.addEventListener('click', () => { P.status = b.dataset.pstatus; render(); }));
    on('#pQ', 'input', debounce((e) => { P.q = e.target.value; render(); $('#pQ').focus(); }, 250));
  }
  if (r === 'compare') {
    on('#cA', 'change', (e) => { C.a = e.target.value; render(); });
    on('#cB', 'change', (e) => { C.b = e.target.value; render(); });
    on('#cR', 'change', (e) => { C.risk = e.target.value; render(); });
    on('#cT', 'change', (e) => { C.group = e.target.value; render(); });
  }
  if (r === 'history') on('#hQ', 'input', debounce((e) => { Hs.q = e.target.value; render(); $('#hQ').focus(); }, 250));
  if (r === 'track') on('#tPick', 'change', (e) => { T.pick = e.target.value; render(); });
  document.querySelectorAll('a[data-matrix]').forEach((a) => a.addEventListener('click', () => { M.a = a.dataset.matrix; M.b = ''; }));
  document.querySelectorAll('select[data-verify]').forEach((sel) => sel.addEventListener('change', () => saveVerification(sel.dataset.verify, sel.value, sel)));
  document.querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', () => openApprovalForm(b)));
  document.querySelectorAll('[data-request]').forEach((b) => b.addEventListener('click', () => requestScan(b.dataset.request, b)));
  document.querySelectorAll('[data-review]').forEach((b) => b.addEventListener('click', () => approveScan(b.dataset.review, b)));
  document.querySelectorAll('[data-export]').forEach((b) => b.addEventListener('click', () => exportReport(b.dataset.export, b)));
}
function debounce(fn, ms) { let t; return (e) => { clearTimeout(t); t = setTimeout(() => fn(e), ms); }; }

// ── shared state (db) ────────────────────────────────────────────────────────────────────────
async function saveVerification(key, status, el) {
  if (!db || !me) return;
  el.disabled = true;
  try { await db.collection('verification').doc(key).set({ status, by: me, at: new Date().toISOString() }); }
  catch (e) { el.insertAdjacentHTML('afterend', `<span class="chip c-bad">Not saved: ${esc(e.message || e.code)}</span>`); }
  finally { el.disabled = false; }
}
async function requestScan(rel, btn) {
  if (!db || !me) return;
  btn.disabled = true;
  try { await db.collection('scan_requests').doc(hid(rel + Date.now())).set({ release: rel, by: me, at: new Date().toISOString(), status: 'requested' });
    btn.outerHTML = `<span class="chip c-good">Request sent for ${esc(rel === 'production' ? 'the live app' : rel)}</span>`; }
  catch (e) { btn.disabled = false; btn.insertAdjacentHTML('afterend', `<span class="chip c-bad">Not sent: ${esc(e.message || e.code)}</span>`); }
}
async function approveScan(id, btn) {
  if (!db || !me) return;
  btn.disabled = true;
  try { await db.collection('approvals').doc('review:' + id).set({ kind: 'snapshot_review', snapshot: id, by: me, at: new Date().toISOString() }); }
  catch (e) { btn.disabled = false; btn.insertAdjacentHTML('afterend', `<span class="chip c-bad">Not saved: ${esc(e.message || e.code)}</span>`); }
}
function openApprovalForm(btn) {
  const key = btn.dataset.approve, ap = approvals[key] || {};
  const fields = [['reason', 'Why it changed'], ['jira', 'Jira ticket'], ['pr', 'Developer change (pull request link)'], ['requested_by', 'Asked for by'],
    ['approved_by', 'Approved by (for example Chris Amani, Mathieu Lachapelle)'], ['approval_date', 'Date approved (for example 2026-10-29)'], ['evidence', 'Proof (a link to the approval message or ticket comment)']];
  const fid = 'ap-' + hid(key);
  btn.outerHTML = `<form class="grid2" id="${fid}" style="flex-basis:100%">${fields.map(([f, l]) => `<label class="ctl">${esc(l)}<input type="text" id="${fid}-${f}" name="${f}" value="${esc(ap[f] || '')}"></label>`).join('')}
    <div class="row"><button class="btn" type="submit">Save the approval record</button><span class="muted" style="font-size:.8rem">Leave a box empty if you don’t have proof for it. Never fill one in from a guess.</span></div></form>`;
  $('#' + fid).addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const data = { by: me, at: new Date().toISOString() };
    fields.forEach(([f]) => { const v = ev.target.elements[f].value.trim(); data[f] = v || null; });
    try { await db.collection('approvals').doc(key).set(data); }
    catch (e) { ev.target.insertAdjacentHTML('beforeend', `<span class="chip c-bad">Not saved: ${esc(e.message || e.code)}</span>`); }
  });
}
// spreadsheets (CSV) in plain words, so anyone can open them in Excel
function csv(rows) { return '﻿' + rows.map((r) => r.map((x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
function changesCsv(changes, scope) {
  return csv([['Priority', 'Change', 'Kind', 'What changed', 'Why it matters', 'Who is affected', 'How to check it', 'Test result']]
    .concat(changes.map((c) => { const p = plainOf(c), v = verif[itemKey(scope, c)];
      return [p.priority, p.headline, GROUPS[p.group] || '', p.what, p.why, (p.roles || []).join(', '), p.check.map((x, i) => `${i + 1}. ${x}`).join('\n'), v ? v.status : 'Not Tested']; })));
}
async function exportReport(which, btn) {
  const dl = await window.claude?.use?.('downloads');
  let name, body;
  if (which === 'prd_vs_impl') {
    const impl = S[D.prd_vs_impl.implementation], scope = 'pvi-' + D.prd_vs_impl.implementation;
    name = 'App vs the original plan.csv';
    body = csv([['Permission', 'Result', 'Explanation', 'The original plan says', 'The app: switched on for', 'Test result']]
      .concat(D.prd_vs_impl.rows.map((r) => [r.plain_label || r.label, (VERDICT[r.status] || [r.status])[0], r.plain_detail || r.detail,
        r.prd_expectation ? r.prd_expectation.controls_verbatim : 'Not in the original plan',
        r.implementation ? r.implementation.holders.map((h) => roleNameIn(impl, h)).join(', ') : 'Not in the app',
        (verif[scope + ':' + r.key] || {}).status || 'Not Tested'])));
  } else if (which === 'compare') { name = `Differences - ${nice(entry(C.a))} to ${nice(entry(C.b))}.csv`; body = changesCsv(E.compare(S[C.a], S[C.b]).changes, 'cmp-' + C.a + '-' + C.b); }
  else { const e = reg().find((x) => x.change_report === which); name = `Changes in ${nice(e)}.csv`; body = changesCsv(D.reports[which].changes, e.id); }
  if (dl) {
    try { await dl.save({ filename: name, data: body }); }
    catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') btn.insertAdjacentHTML('afterend', `<span class="chip c-warn">Not saved: ${esc(e.message || e.code)}</span>`); }
  } else {
    btn.insertAdjacentHTML('afterend', '<span class="chip c-warn">Downloads are not available here</span>');
  }
}

async function connect() {
  if (!window.claude || !window.claude.use) return;
  user = await window.claude.use('user');
  if (user) {
    try { me = await user.id(); } catch (e) { me = null; }
    try { canApprove = !!(await user.canEdit()); } catch (e) { canApprove = false; }
  }
  db = await window.claude.use('db');
  if (!db) return;
  try { const c = await user?.can?.('data.write'); canWriteDb = !!me && c !== false; } catch (e) { canWriteDb = !!me; }
  const resolveNames = async (ids) => {
    const need = ids.filter((i) => i && !names[i]);
    if (!need.length || !user) return;
    try { const ps = await user.profiles(need); Object.entries(ps || {}).forEach(([id, p]) => { names[id] = (p && p.name) || 'Someone'; }); } catch (e) { /* names stay generic */ }
  };
  const sub = (coll, target, isList) => db.collection(coll).onSnapshot(async (snap) => {
    if (isList) { target.length = 0; snap.docs.forEach((d) => target.push(Object.assign({ id: d.id }, d.data()))); }
    else { Object.keys(target).forEach((k) => delete target[k]); snap.docs.forEach((d) => { target[d.id] = d.data(); }); }
    await resolveNames(snap.docs.map((d) => (d.data() || {}).by));
    if (!document.activeElement || !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) render();
  }, () => {});
  sub('verification', verif, false);
  sub('approvals', approvals, false);
  sub('scan_requests', requests, true);
  render();
}

// ── boot ─────────────────────────────────────────────────────────────────────────────────────
fetch('data.json').then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then((data) => {
  D = data;
  Object.entries(D.snapshots).forEach(([id, s]) => { S[id] = s; });
  (D.pending || []).forEach((p) => { S[p.snapshot_id] = p; });
  buildStrip();
  render();
  connect();
}).catch((e) => {
  $('#main').innerHTML = `<section class="panel"><div class="notice bad">The page’s data could not be loaded. Please reload. (${esc(e.message)})</div></section>`;
});
})();
</script>
