    <div class="sv-scrim" style="position: absolute;">
      <div class="sv-modal" role="dialog" data-sv-component="CompletionWizard" data-sv-change="new" style="width: 540px;">
        <div class="sv-modal__header"><div class="sv-modal__title">Close work order S2-35102?</div><button type="button" class="sv-modal__close" aria-label="Close"><x-import component-from-global-scope="SV.Icon" name="x" size="{{ 20 }}" hint-size="20px,20px"></x-import></button></div>

          <div style="width: 220px;"><x-import component-from-global-scope="SV.Input" label="Posting date" value="Oct 22, 2026" icon="calendar" hint-size="220px,48px"></x-import></div>
          <div class="sv-card sv-card--flush" style="display: flex; flex-direction: column;">
            <div style="display: flex; flex-direction: column; gap: var(--sv-space-1); padding: var(--sv-space-3) var(--sv-space-4); border-bottom: 1px solid var(--sv-border-default);">
              <div style="display: flex; justify-content: space-between; gap: var(--sv-space-4);"><span class="sv-body-strong">Stock parts</span><span class="sv-body-strong">$180.00</span></div>
              <span class="sv-body2" style="color: var(--sv-text-secondary);">Posted to 6430 Warranty &amp; Goodwill Expense</span>

            <div style="display: flex; flex-direction: column; gap: var(--sv-space-1); padding: var(--sv-space-3) var(--sv-space-4); border-bottom: 1px solid var(--sv-border-default);">
              <div style="display: flex; justify-content: space-between; gap: var(--sv-space-4);"><span class="sv-body-strong">Labor</span><span class="sv-body-strong">2.0 h</span></div>
              <span class="sv-body2" style="color: var(--sv-text-secondary);">Hours only, nothing posted</span>
            </div>

          </div>
          <span class="sv-body" style="color: var(--sv-text-secondary); text-wrap: pretty;">This posts the parts cost and shop supplies to your books and marks the work order Closed · No Charge. You can reopen it later.</span>
        </div>
        <div class="sv-modal__footer">
          <x-import component-from-global-scope="SV.Button" variant="secondary" hint-size="80px,36px">Cancel</x-import>
          <x-import component-from-global-scope="SV.Button" variant="primary" hint-size="160px,36px">Close Work Order</x-import>
        </div>
      </div>
